min_version = "2025.7.12"

[tools]
rust = "1.93.1"
shellcheck = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-deb" = "latest"

[tasks.toolchain]
description = "Materialize the pinned Rust toolchain"
# Tasks that run in parallel would otherwise each make rustup install the pinned
# toolchain, and those concurrent installs collide in rustup's shared download
# directory. Depending on this task makes the install happen once, serially.
# RUSTUP_TOOLCHAIN is set to the pinned version by mise.
run = "rustup toolchain install \"$RUSTUP_TOOLCHAIN\" --no-self-update --profile minimal"

[tasks.toolchain-lint]
description = "Add rustfmt and clippy to the pinned toolchain"
# The minimal profile omits both, and `cargo fmt`/`cargo clippy` error rather
# than installing them on demand. Kept separate from `toolchain` so building and
# testing, which is all a release does, never pulls the lint components.
depends = ["toolchain"]
run = "rustup component add rustfmt clippy"

[tasks.fmt]
description = "Check Rust formatting"
depends = ["toolchain-lint"]
run = "cargo fmt --all --check"

[tasks.format]
description = "Format Rust sources"
depends = ["toolchain-lint"]
run = "cargo fmt --all"

[tasks.lint]
description = "Run Clippy with warnings denied"
depends = ["toolchain-lint"]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint-stable]
description = "Run Clippy on the current stable Rust toolchain"
run = "mise exec rust@stable -- cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the Rust test suite"
depends = ["toolchain"]
run = "cargo test --all-features"

[tasks.shellcheck]
description = "Lint shell automation"
run = "shellcheck scripts/*.sh"

[tasks.check]
description = "Run formatting, lint, tests, and shell automation checks"
depends = ["fmt", "lint", "test", "shellcheck"]

[tasks.build]
description = "Build the release binary"
# Deliberately independent of `check`. Releases build and smoke test each target
# natively, while formatting, Clippy, and ShellCheck are architecture-independent
# and already gated by CI on the same commit. Use `check` for the gate, or
# `install`, which runs it.
depends = ["toolchain"]
run = "cargo build --release --locked"

[tasks.install]
description = "Install porta through Cargo"
depends = ["check"]
run = "cargo install --path . --locked --force"

[tasks.smoke]
description = "Run the isolated end-to-end CLI smoke test"
depends = ["build"]
run = "bash scripts/smoke.sh"

[tasks.docs]
description = "Generate the man pages and shell completions"
# Rendered from the same clap command tree that produces `--help`, so neither
# can drift from the arguments porta accepts. Writes target/dist, which the
# Debian package and the release archives both install from. Not part of
# `check`: nothing here is a gate, and `cargo clippy --all-targets` already
# compiles the generator.
depends = ["toolchain"]
run = "cargo run --quiet --example generate-docs"

[tasks.deb]
description = "Package the release binary as a Debian package"
# The Debian assets name files under target/dist, so they have to exist before
# cargo-deb goes looking for them.
depends = ["build", "docs"]
run = "cargo deb --no-build"

[tasks.audit]
description = "Audit Rust dependencies for known vulnerabilities"
run = "cargo audit"

[tasks.package]
description = "Validate the crate package contents"
depends = ["check"]
run = "cargo package --locked --allow-dirty"

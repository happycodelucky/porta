name: Release

# Pushing a v* tag builds every supported binary, publishes a checksummed GitHub
# release, updates the Homebrew tap formula, and publishes to crates.io. The same
# run can be dispatched manually against an existing tag, or asked to create the
# tag first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.9.1
        required: true
      create_tag:
        description: >-
          Create and push this tag from the current branch. Leave unchecked to
          release a tag that already exists.
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Repository that hosts the Homebrew formula, as OWNER/homebrew-<name>.
  # `brew install happycodelucky/tap/porta` resolves to happycodelucky/homebrew-tap.
  TAP_REPOSITORY: happycodelucky/homebrew-tap

jobs:
  prepare:
    name: resolve tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # The full history is needed to create a tag from the dispatched branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tag, creating it only when asked
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATE_TAG: ${{ inputs.create_tag }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # The tag already exists; that push is what started this run.
            tag="$GITHUB_REF_NAME"
            create=false
          else
            tag="$INPUT_TAG"
            create="$CREATE_TAG"
          fi

          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '$tag' must look like v1.2.3"
              exit 1
              ;;
          esac

          version="${tag#v}"
          exists=false
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            exists=true
          fi

          if [ "$create" = "true" ]; then
            # Refuse to move an existing tag. Released artifacts are checksummed
            # against it, so repointing one would invalidate what is published.
            if [ "$exists" = "true" ]; then
              echo "::error::tag $tag already exists; re-run with create_tag unchecked to release it"
              exit 1
            fi
            # The tag must describe the commit it names, so check the manifest
            # before creating anything.
            manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            if [ "$version" != "$manifest" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $manifest"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Port Authority $version"
            # A tag pushed with GITHUB_TOKEN does not trigger workflows, so this
            # cannot start a second Release run.
            git push origin "$tag"
            echo "::notice::created tag $tag at $(git rev-parse --short HEAD)"
          elif [ "$exists" = "false" ]; then
            echo "::error::tag $tag does not exist; re-run with create_tag checked to create it"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Every target builds natively on its own runner, so there is no
        # cross-compilation and each binary is smoke-tested on the platform it
        # ships to. The jobs run in parallel, so the wall clock is one build
        # rather than the sum. Linux builds use 22.04 so the glibc floor stays
        # low enough for older distributions.
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: jdx/mise-action@v4

      - name: Confirm the runner is the expected target
        run: |
          host="$(rustc -vV | awk '/^host:/ { print $2 }')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::runner host $host does not match ${{ matrix.target }}"
            exit 1
          fi

      # Builds the release binary and exercises it end to end on this platform.
      # Formatting, Clippy, and ShellCheck are not repeated here: they are
      # architecture-independent and CI gates them on the same commit.
      - name: Build and verify
        run: mise run smoke

      # Rendered from the clap command tree of the commit being released, so the
      # pages and completions always describe the binary shipped beside them.
      # The output is identical on every runner; regenerating per target is
      # simpler than moving one copy between jobs, and takes a couple of seconds.
      - name: Generate the man pages and completions
        run: mise run docs

      - name: Package archive
        run: |
          version="${{ needs.prepare.outputs.version }}"
          name="porta-v${version}-${{ matrix.target }}"
          staging="$(mktemp -d)"
          cp target/release/porta LICENSE README.md "$staging/"
          cp -R target/dist/man target/dist/completions "$staging/"
          tar czf "${name}.tar.gz" -C "$staging" .
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      # Debian packaging only applies to the Linux targets. cargo-deb reuses the
      # binary the smoke test just verified rather than rebuilding it, and names
      # the architecture from the host, so each Linux runner emits its own.
      - name: Package Debian archive
        if: runner.os == 'Linux'
        run: |
          mise run deb
          package="$(ls target/debian/*.deb)"
          # cargo-deb resolves the glibc floor through dpkg-shlibdeps, and only
          # warns when that tool is unavailable. Fail instead of shipping a
          # package that silently declares no dependencies at all.
          if [ -z "$(dpkg-deb --field "$package" Depends)" ]; then
            echo "::error::$package declares no dependencies; is dpkg-dev installed?"
            exit 1
          fi
          cp "$package" .
          name="$(basename "$package")"
          shasum -a 256 "$name" > "${name}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            porta-v*.tar.gz
            porta-v*.tar.gz.sha256
            porta_*.deb
            porta_*.deb.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Confirm the tag matches Cargo.toml
        run: |
          version="${{ needs.prepare.outputs.version }}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag v$version does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Collect checksums
        working-directory: artifacts
        run: cat ./*.sha256 | tee SHA256SUMS

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          assets=(artifacts/*.tar.gz artifacts/*.deb artifacts/SHA256SUMS)
          # `gh release create` fails if the release already exists, which breaks
          # re-running a tag. When it exists, replace its assets in place instead.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists; replacing its assets"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              "${assets[@]}"
          fi

  homebrew:
    name: update Homebrew tap
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Pushing to another repository needs a PAT; the built-in GITHUB_TOKEN is
      # scoped to this one. Without it the release still succeeds and only the
      # tap update is skipped.
      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the tap update"
          fi

      - name: Render the formula
        if: steps.token.outputs.present == 'true'
        run: |
          version="${{ needs.prepare.outputs.version }}"
          owner="${GITHUB_REPOSITORY%%/*}"
          scripts/render-formula.sh "$version" "$owner" artifacts > porta.rb
          cat porta.rb

      - name: Publish the formula to the tap
        if: steps.token.outputs.present == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"

          # actions/checkout cannot be used for the tap: a freshly created tap
          # has no commits and therefore no branch, and checkout fails on it.
          # Init a local repo instead and adopt the remote's main only when it
          # already exists, so an empty tap is seeded on the first release.
          git init -b main tap
          cd tap
          git remote add origin "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git"
          if git fetch --depth=1 origin main 2>/dev/null; then
            git reset --hard origin/main
          else
            echo "Tap is empty; seeding it"
          fi

          mkdir -p Formula
          cp ../porta.rb Formula/porta.rb
          git add Formula/porta.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Formula already current for $tag"
            exit 0
          fi
          git commit -m "porta $tag"
          git push origin main

  crates:
    name: publish to crates.io
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    permissions:
      # Lets the job request the OIDC token that crates.io trusted publishing
      # exchanges for a short-lived registry token. No API token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: jdx/mise-action@v4

      # crates.io versions are immutable and cannot be republished, so never
      # attempt one that is already up. This keeps re-runs of a tag from failing.
      - name: Skip a version that is already published
        id: check
        run: |
          version="${{ needs.prepare.outputs.version }}"
          url="https://crates.io/api/v1/crates/port-authority/${version}"
          if curl -fsS -A "porta-release" "$url" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::port-authority ${version} is already on crates.io; skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.check.outputs.publish == 'true'

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
